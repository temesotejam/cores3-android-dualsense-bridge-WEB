name: Apply optional PCA9685 patch

on:
  push:
    branches:
      - agent/allow-vesc-without-pca9685
    paths:
      - ".github/workflows/patch-i2c-optional.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout branch
        uses: actions/checkout@v6

      - name: Make PCA9685 optional
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("src/main.cpp")
          text = path.read_text(encoding="utf-8")

          old_flag = "bool gOutputsInitialized = false;\n"
          new_flags = "bool gPcaInitialized = false;\nbool gVescInitialized = false;\n"
          if text.count(old_flag) != 1:
              raise SystemExit("unexpected output initialization flag")
          text = text.replace(old_flag, new_flags)

          setup_start = text.index("void outputs_setup(void)\n{")
          apply_start = text.index("\nvoid outputs_apply(", setup_start)
          new_setup = '''void outputs_setup(void)
          {
              gPreferences.begin("ctrl-servo", false);
              loadServoLimits();

              Wire.begin(CONTROL_I2C_SDA_PIN, CONTROL_I2C_SCL_PIN);
              if (pcaProbe()) {
                  pcaWrite8(kPcaMode1, 0x10); /* sleep before prescale */
                  pcaWrite8(kPcaPrescale, static_cast<uint8_t>((25000000.0 / (4096.0 * CONTROL_PCA9685_FREQ)) - 1.0 + 0.5));
                  pcaWrite8(kPcaMode1, 0x00);
                  delay(5);
                  pcaWrite8(kPcaMode1, 0xa1); /* auto-increment + restart */

                  setServoNormalized(CONTROL_SERVO_LEFT_WING_CH, 0, gServoLimits.left_wing_min, gServoLimits.left_wing_max);
                  setServoNormalized(CONTROL_SERVO_RIGHT_WING_CH, 0, gServoLimits.right_wing_min, gServoLimits.right_wing_max);
                  setServoNormalized(CONTROL_SERVO_VECTOR_CH, 0, gServoLimits.vector_min, gServoLimits.vector_max);
                  gPcaInitialized = true;
                  debug_logf("PCA9685 ready at 0x%02X", CONTROL_PCA9685_ADDR);
                  screen_statusf("PCA9685 OK @0x%02X", CONTROL_PCA9685_ADDR);
              } else {
                  debug_logf("PCA9685 not found at 0x%02X on SDA=%d SCL=%d; servo output disabled",
                             CONTROL_PCA9685_ADDR, CONTROL_I2C_SDA_PIN, CONTROL_I2C_SCL_PIN);
                  screen_statusf("PCA9685 absent / servo off");
              }

              VescSerial.begin(CONTROL_VESC_UART_BAUD, SERIAL_8N1,
                               CONTROL_VESC_UART_RX_PIN, CONTROL_VESC_UART_TX_PIN);
              vescSendDuty(0.0f);
              gVescInitialized = true;
              debug_logf("VESC UART ready: %d baud duty_max=%.2f",
                         CONTROL_VESC_UART_BAUD, CONTROL_VESC_MAX_DUTY);
              screen_statusf("VESC duty max %.2f", CONTROL_VESC_MAX_DUTY);
              debug_logf("Servo limits LW[%d,%d] RW[%d,%d] V[%d,%d]",
                         gServoLimits.left_wing_min, gServoLimits.left_wing_max,
                         gServoLimits.right_wing_min, gServoLimits.right_wing_max,
                         gServoLimits.vector_min, gServoLimits.vector_max);
          }
          '''
          new_setup = "\n".join(line[10:] if line.startswith("          ") else line for line in new_setup.splitlines()) + "\n"
          text = text[:setup_start] + new_setup + text[apply_start:]

          apply_start = text.index("void outputs_apply(int leftWing, int rightWing, int vectorServo, int motorSpeed)\n{")
          get_limits_start = text.index("\nextern \"C\" bool outputs_get_servo_limits", apply_start)
          new_apply = '''void outputs_apply(int leftWing, int rightWing, int vectorServo, int motorSpeed)
          {
              if (gPcaInitialized) {
                  setServoNormalized(CONTROL_SERVO_LEFT_WING_CH, leftWing,
                                     gServoLimits.left_wing_min, gServoLimits.left_wing_max);
                  setServoNormalized(CONTROL_SERVO_RIGHT_WING_CH, rightWing,
                                     gServoLimits.right_wing_min, gServoLimits.right_wing_max);
                  setServoNormalized(CONTROL_SERVO_VECTOR_CH, vectorServo,
                                     gServoLimits.vector_min, gServoLimits.vector_max);
              }

              if (gVescInitialized) {
                  const float duty = CONTROL_VESC_MAX_DUTY *
                                     static_cast<float>(constrain(motorSpeed, 0, 100)) / 100.0f;
                  vescSendDuty(duty);
              }
          }
          '''
          new_apply = "\n".join(line[10:] if line.startswith("          ") else line for line in new_apply.splitlines()) + "\n"
          text = text[:apply_start] + new_apply + text[get_limits_start:]

          if text.count("if (gOutputsInitialized)") != 1:
              raise SystemExit("unexpected servo limit initialization guard")
          text = text.replace("if (gOutputsInitialized)", "if (gPcaInitialized)")

          if "gOutputsInitialized" in text:
              raise SystemExit("old output flag remains")
          path.write_text(text, encoding="utf-8")
          PY

      - name: Commit patch
        shell: bash
        run: |
          set -euxo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main.cpp
          git commit -m "Allow VESC operation without PCA9685"
          git push
